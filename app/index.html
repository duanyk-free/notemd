<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notemd</title>

<!-- CodeMirror (local) -->
<link rel="stylesheet" href="vendor/codemirror/codemirror.min.css">
<link rel="stylesheet" href="vendor/codemirror/theme/material-darker.min.css">
<link rel="stylesheet" href="vendor/codemirror/theme/eclipse.min.css">
<link rel="stylesheet" href="vendor/codemirror/addon/dialog/dialog.min.css">
<link rel="stylesheet" href="vendor/codemirror/addon/fold/foldgutter.min.css">
<!-- Pygments (local) -->
<link rel="stylesheet" href="pygments-dark.css" id="pygments-theme">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <div id="main-area">
    <div id="tab-bar">
      <div id="tabs"></div>
      <button id="btn-new-tab" title="New file (Ctrl+N)">＋</button>
    </div>
    <div id="editor-container">
      <div id="editor-pane"></div>
      <div id="preview-pane" class="hidden">
        <div id="preview-toolbar">
          <span>📄 Preview</span>
          <button id="btn-close-preview" title="Close preview">✕</button>
        </div>
        <div id="preview-content" class="markdown-body"></div>
      </div>
    </div>
  </div>

  <div id="file-picker-overlay" class="modal-overlay hidden">
    <div id="file-picker" class="modal-dialog">
      <div class="modal-header">
        <span>📂 Open File</span>
        <button id="btn-picker-close" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="picker-breadcrumb"></div>
        <div id="picker-file-list"></div>
      </div>
      <div class="modal-footer">
        <input id="picker-input" type="text" placeholder="Filename or full path..." />
        <div class="modal-buttons">
          <button id="btn-picker-cancel">Cancel</button>
          <button id="btn-picker-open" class="btn-primary">Open</button>
        </div>
      </div>
    </div>
  </div>

  <footer id="status-bar">
    <span id="status-file" title="Current file path">untitled</span>
    <span class="status-sep">│</span>
    <span id="status-position">Ln 1, Col 1</span>
    <span class="status-sep">│</span>
    <span id="status-words">0 words</span>
    <span class="status-sep">│</span>
    <span id="status-mode">Plain Text</span>
    <span class="status-spacer"></span>
    <div class="status-actions">
      <button id="btn-open" title="Open file (Ctrl+O)">📂 Open</button>
      <button id="btn-save" title="Save (Ctrl+S)">💾 Save</button>
      <button id="btn-preview" title="Toggle preview (Ctrl+Shift+P)">👁 Preview</button>
      <button id="btn-theme" title="Toggle dark/light theme">🌓</button>
    </div>
  </footer>
</div>

<!-- All scripts are local — zero CDN dependency -->
<script src="vendor/codemirror/codemirror.min.js"></script>
<script src="vendor/codemirror/mode/markdown/markdown.min.js"></script>
<script src="vendor/codemirror/mode/python/python.min.js"></script>
<script src="vendor/codemirror/mode/javascript/javascript.min.js"></script>
<script src="vendor/codemirror/mode/xml/xml.min.js"></script>
<script src="vendor/codemirror/mode/css/css.min.js"></script>
<script src="vendor/codemirror/mode/shell/shell.min.js"></script>
<script src="vendor/codemirror/mode/clike/clike.min.js"></script>
<script src="vendor/codemirror/mode/yaml/yaml.min.js"></script>
<script src="vendor/codemirror/mode/sql/sql.min.js"></script>
<!-- Dockerfile mode removed: requires simple addon -->
<script src="vendor/codemirror/addon/fold/foldcode.min.js"></script>
<script src="vendor/codemirror/addon/fold/foldgutter.min.js"></script>
<script src="vendor/codemirror/addon/fold/markdown-fold.min.js"></script>
<script src="vendor/codemirror/addon/fold/brace-fold.min.js"></script>
<script src="vendor/codemirror/addon/fold/xml-fold.min.js"></script>
<script src="vendor/codemirror/addon/edit/closebrackets.min.js"></script>
<script src="vendor/codemirror/addon/search/search.min.js"></script>
<script src="vendor/codemirror/addon/search/searchcursor.min.js"></script>
<script src="vendor/codemirror/addon/dialog/dialog.min.js"></script>
<script src="vendor/codemirror/addon/selection/active-line.min.js"></script>
<script src="app.js"></script>
</body>
</html>
