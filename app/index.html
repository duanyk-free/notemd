<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notemd</title>

<!-- CodeMirror 5 core -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/eclipse.min.css">
<!-- CodeMirror addons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">
<!-- Pygments code highlighting (server-side rendered) -->
<link rel="stylesheet" href="pygments-dark.css" id="pygments-theme">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <!-- ── Main area ── -->
  <div id="main-area">
    <div id="tab-bar">
      <div id="tabs"></div>
      <button id="btn-new-tab" title="New file (Ctrl+N)">＋</button>
    </div>

    <div id="editor-container">
      <div id="editor-pane"></div>
      <div id="preview-pane" class="hidden">
        <div id="preview-toolbar">
          <span>📄 Preview</span>
          <button id="btn-close-preview" title="Close preview">✕</button>
        </div>
        <div id="preview-content" class="markdown-body"></div>
      </div>
    </div>
  </div>

  <!-- ── File picker modal ── -->
  <div id="file-picker-overlay" class="modal-overlay hidden">
    <div id="file-picker" class="modal-dialog">
      <div class="modal-header">
        <span>📂 Open File</span>
        <button id="btn-picker-close" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="picker-breadcrumb"></div>
        <div id="picker-file-list"></div>
      </div>
      <div class="modal-footer">
        <input id="picker-input" type="text" placeholder="Filename or full path..." />
        <div class="modal-buttons">
          <button id="btn-picker-cancel">Cancel</button>
          <button id="btn-picker-open" class="btn-primary">Open</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Status bar ── -->
  <footer id="status-bar">
    <span id="status-file" title="Current file path">untitled</span>
    <span class="status-sep">│</span>
    <span id="status-position">Ln 1, Col 1</span>
    <span class="status-sep">│</span>
    <span id="status-words">0 words</span>
    <span class="status-sep">│</span>
    <span id="status-mode">Plain Text</span>
    <span class="status-spacer"></span>
    <div class="status-actions">
      <button id="btn-open" title="Open file (Ctrl+O)">📂 Open</button>
      <button id="btn-save" title="Save (Ctrl+S)">💾 Save</button>
      <button id="btn-preview" title="Toggle preview (Ctrl+Shift+P)">👁 Preview</button>
      <button id="btn-theme" title="Toggle dark/light theme">🌓</button>
    </div>
  </footer>
</div>

<!-- ── CodeMirror (CDN — editor core) ── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<!-- Modes -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/shell/shell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/dockerfile/dockerfile.min.js"></script>
<!-- Addons -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/markdown-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/brace-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/xml-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>

<script src="app.js"></script>
</body>
</html>
